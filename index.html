<body>
<style>
:root{--g:#3a5c1e;--gd:#2a4215;--gbdr:#c4d49a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:#1a1a1a;background:#fff;-webkit-text-size-adjust:100%}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--g);position:relative;overflow:hidden}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.06),transparent 60%)}
.lcard{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,20,10,.4);position:relative;z-index:1;margin:20px}
.lc-logo{width:64px;height:64px;margin:0 auto 14px;display:block;object-fit:contain}
.lc-brand{text-align:center;font-size:18px;font-weight:700;color:var(--g);letter-spacing:1px;margin-bottom:4px}
.lc-sub{text-align:center;font-size:11px;color:#888;margin-bottom:28px}
.lc-err{display:none;background:#fff0f0;border:1px solid #fcc;border-radius:8px;padding:10px 14px;font-size:12px;color:#c0392b;margin-bottom:14px}
.lc-err.show{display:block}
.lfg{margin-bottom:14px}
.lfg label{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:5px}
.lfg input{width:100%;padding:11px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#f9f9f9;transition:border-color .15s}
.lfg input:focus{border-color:var(--g);background:#fff}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;font-size:16px;line-height:1}
.btn-login{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn-login:disabled{background:#aaa;cursor:not-allowed}
.spin-sm{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.lc-note{text-align:center;font-size:11px;color:#bbb;margin-top:16px}
#app{display:none;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;border-left:0.5px solid #e0e0e0;border-right:0.5px solid #e0e0e0}
#app.ready{display:flex}
.topbar{background:var(--g);color:#fff;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:9px}
.tb-logo{width:28px;height:28px;background:#fff;border-radius:6px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-logo img{width:100%;height:100%;object-fit:contain}
.tb-title{font-size:14px;font-weight:500;letter-spacing:.5px}
.tb-user{display:flex;align-items:center;gap:7px}
.tb-avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tb-name{font-size:11px;opacity:.85}
.tb-logout{background:rgba(255,255,255,.15);color:#fff;border:none;padding:4px 9px;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit}
.tabbar{display:flex;background:#f5f5f5;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:#888;display:flex;align-items:center;justify-content:center;gap:5px;user-select:none}
.tab.active{color:var(--g);border-bottom-color:var(--g);background:#fff}
.tbdg{background:var(--g);color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;font-weight:700;min-width:16px;text-align:center}
.content{flex:1;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none}
.panel.active{display:block}
.panel::-webkit-scrollbar{width:2px}
.panel::-webkit-scrollbar-thumb{background:#ddd;border-radius:1px}
.swrap{position:sticky;top:0;z-index:5;padding:10px 13px;background:#fff;border-bottom:1px solid #eee}
.sinp{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;background:#f9f9f9;outline:none}
.sinp:focus{border-color:var(--g);background:#fff}
.cg{border-bottom:1px solid #f0f0f0}
.chdr{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;background:#f7f7f7;user-select:none}
.carr{font-size:10px;color:#999;transition:transform .15s;width:11px;text-align:center;flex-shrink:0}
.chdr.open .carr{transform:rotate(90deg)}
.cnm{font-size:14px;font-weight:500;flex:1}
.cct{font-size:10px;padding:1px 7px;border-radius:10px;background:#e8f4ee;color:var(--g);font-weight:600}
.cbody{display:none}
.cbody.open{display:block}
.pcard{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-left:3px solid transparent}
.pcard:active{background:#f7f7f7}
.pcard.sel{border-left-color:var(--g);background:#f9fdf5}
.pchk{width:20px;height:20px;flex-shrink:0;accent-color:var(--g);cursor:pointer;margin-top:2px}
.pi{flex:1;min-width:0}
.pnm{font-size:14px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:2px}
.brnd{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--g);color:#fff;flex-shrink:0}
.pl{font-size:12px;color:#666;margin-top:1px;line-height:1.5}
.pprice{display:flex;gap:16px;margin-top:5px}
.pp-item{display:flex;align-items:center;gap:4px}
.pp-lbl{font-size:11px;color:#888}
.pp-val{font-size:13px;font-weight:600;color:var(--g)}
.fsec{padding:14px;border-bottom:1px solid #eee}
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:4px}
.fld input,.fld textarea{width:100%;padding:10px 13px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;background:#f9f9f9;outline:none;-webkit-appearance:none;color:#1a1a1a}
.fld input:focus,.fld textarea:focus{border-color:var(--g);background:#fff}
.fld textarea{resize:none;height:52px;line-height:1.5}
.fld .ro{color:#888;background:#f0f0f0}
.ssec{padding:13px 14px}
.sshdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sshdr h3{font-size:11px;font-weight:600;color:#888;letter-spacing:.5px;text-transform:uppercase}
.clrbtn{font-size:12px;color:#c0392b;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:6px}
.icard{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:12px;margin-bottom:10px;border-left:3px solid var(--g)}
.icard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}
.ititle{display:flex;align-items:center;flex-wrap:wrap;gap:5px;flex:1}
.inm{font-size:14px;font-weight:500}
.ibrnd{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--g);color:#fff}
.iorig{font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid #ddd;color:#666}
.irm{background:none;border:none;cursor:pointer;color:#c0392b;font-size:18px;line-height:1;padding:2px 5px;border-radius:4px;flex-shrink:0}
.imeta{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px}
.mtag{display:inline-flex;padding:3px 7px;border:1px solid #eee;border-radius:6px;font-size:11px;color:#666}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pcell{display:flex;flex-direction:column;gap:3px;border:1px solid #e8e8e8;border-radius:8px;padding:9px 10px}
.pcell label{font-size:10px;font-weight:600;color:#888;letter-spacing:.3px}
.pval{font-size:18px;font-weight:700;color:var(--g);margin-top:2px}
.pval.na{color:#ccc;font-size:14px;font-weight:400}
.rem-i{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;-webkit-appearance:none}
.rem-i:focus{border-color:var(--g)}
.empty{text-align:center;padding:44px 20px;color:#bbb;font-size:13px}
.ei{font-size:28px;margin-bottom:10px}
.btm{padding:11px 14px;background:#fff;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.cinfo{font-size:12px;color:#888}
.cinfo strong{color:var(--g);font-size:16px}
.btn-gen{background:var(--g);color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px}
.btn-gen:disabled{background:#aaa;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.mdl{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:24px 22px 36px;text-align:center}
.mdl-icon{font-size:48px;margin-bottom:12px}
.mdl-title{font-size:18px;font-weight:700;color:var(--g);margin-bottom:6px}
.mdl-sub{font-size:13px;color:#888;margin-bottom:20px;line-height:1.6}
.mdl-fname{font-size:12px;color:#666;background:#f5f5f5;border-radius:8px;padding:8px 12px;margin-bottom:20px;word-break:break-all;text-align:left}
.btn-dl{display:block;width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;margin-bottom:10px;text-align:center}
.btn-close{display:block;width:100%;padding:11px;background:#f5f5f5;color:#666;border:none;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer}
.ov-loading{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ov-loading.show{display:flex}
.spin-lg{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite}
.loading-txt{font-size:14px;color:#666}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:9999;display:none;white-space:nowrap}
.toast.err{background:#c0392b}
.toast.show{display:block}
</style>

<script>
const C = {ACT:0,CAT:2,ORIG:3,BRD:4,NM:5,SPEC:6,WT:7,BWt:8,PKG:9,PT:10,MP:12,SP:13};
let accounts=[],PRODS=[],selIds=new Set(),iRem={},currentUser=null,aTab='cat';
const catOpen={};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function togglePw(){const i=document.getElementById('lPass');i.type=i.type==='password'?'text':'password';}
function setLL(on){document.getElementById('lBtn').disabled=on;document.getElementById('lSpin').style.display=on?'block':'none';document.getElementById('lBtnTxt').textContent=on?'驗證中…':'登入';}
function showErr(m){const e=document.getElementById('lErr');e.textContent=m;e.classList.add('show');}
function hideErr(){document.getElementById('lErr').classList.remove('show');}

function doLogin(){
  const user=document.getElementById('lUser').value.trim();
  const pass=document.getElementById('lPass').value;
  if(!user||!pass){showErr('請輸入帳號和密碼');return;}
  setLL(true);hideErr();
  const check=()=>{
    const found=accounts.find(a=>a.acc===user&&a.pwd===pass);
    if(!found){setLL(false);showErr('帳號或密碼錯誤');document.getElementById('lPass').value='';return;}
    currentUser=found;initApp();
  };
  if(accounts.length){check();return;}
  fetch(CFG.ACCOUNTS_CSV).then(r=>r.text()).then(csv=>{
    accounts=parseCSV(csv).map(r=>(({acc:(r[0]||'').trim(),pwd:(r[1]||'').trim(),name:(r[2]||'').trim(),line:(r[3]||'').trim(),phone:(r[4]||'').trim()})));
    accounts=accounts.filter(a=>a.acc);
    check();
  }).catch(()=>{setLL(false);showErr('帳號資料載入失敗');});
}

function doLogout(){
  currentUser=null;selIds.clear();iRem={};
  document.getElementById('app').classList.remove('ready');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('lUser').value='';document.getElementById('lPass').value='';
  setLL(false);hideErr();
}

function initApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('ready');
  const name=currentUser.name;
  document.getElementById('tbAvatar').textContent=name?name.charAt(0):'?';
  document.getElementById('tbName').textContent=name;
  document.getElementById('salesDisp').value=name;
  document.getElementById('qDate').value=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});
  if(PRODS.length){renderCat();return;}
  loadProducts();
}

function loadProducts(){
  document.getElementById('catC').innerHTML='<div class="empty"><div class="ei">⏳</div>載入產品資料中…</div>';
  fetch(CFG.PRODUCTS_CSV).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(csv=>{
    PRODS=parseCSV(csv).map((r,i)=>(({id:i,cat:String(r[C.CAT]||'其他').trim(),active:Number(r[C.ACT])===1||String(r[C.ACT]).toUpperCase()==='TRUE',raw:r}))).filter(p=>p.active);
    renderCat();
  }).catch(err=>{document.getElementById('catC').innerHTML=`<div class="empty" style="color:#c0392b"><div class="ei">⚠️</div>無法載入產品資料<br><small>${err.message}</small></div>`;});
}

function parseCSV(text){return text.trim().split('\n').slice(1).map(r=>splitRow(r)).filter(r=>r.some(v=>v.trim()));}
function splitRow(row){const res=[];let cur='',inQ=false;for(const c of row){if(c==='"'){inQ=!inQ}else if(c===','&&!inQ){res.push(cur);cur=''}else{cur+=c}}res.push(cur);return res;}

function renderCat(q=''){
  q=q.toLowerCase();
  const vis=q?PRODS.filter(p=>[p.raw[C.NM],p.raw[C.ORIG],p.raw[C.BRD],p.raw[C.SPEC],p.cat].some(v=>String(v).toLowerCase().includes(q))):PRODS;
  const gs={};vis.forEach(p=>{if(!gs[p.cat])gs[p.cat]=[];gs[p.cat].push(p);});
  const el=document.getElementById('catC');
  if(!Object.keys(gs).length){el.innerHTML='<div class="empty"><div class="ei">🔍</div>沒有符合的品項</div>';return;}
  el.innerHTML=Object.entries(gs).map(([cat,prods])=>{
    if(catOpen[cat]===undefined)catOpen[cat]=true;
    const open=q||catOpen[cat];
    const cid='cg'+cat.replace(/[^\w\u4e00-\u9fff]/g,'_');
    return `<div class="cg">
      <div class="chdr${open?' open':''}" data-cat="${esc(cat)}" data-cid="${cid}" onclick="togCat(this)">
        <span class="carr">▶</span><span class="cnm">${esc(cat)}</span><span class="cct">${prods.length}</span>
      </div>
      <div class="cbody${open?' open':''}" id="${cid}">
        ${prods.map(p=>{
          const r=p.raw,nm=esc(r[C.NM]),br=esc(r[C.BRD]),or=esc(r[C.ORIG]);
          const sp=esc(r[C.SPEC]),wt=esc(r[C.WT]),bw=r[C.BWt]&&r[C.BWt]!=='-'?esc(r[C.BWt]):'';
          const pk=r[C.PKG]&&r[C.PKG]!=='-'?esc(r[C.PKG]):'';
          const mp=r[C.MP]||'',sp2=r[C.SP]||'';
          return `<div class="pcard${selIds.has(p.id)?' sel':''}" onclick="tog(${p.id})">
            <input class="pchk" type="checkbox"${selIds.has(p.id)?' checked':''} onclick="event.stopPropagation();tog(${p.id})">
            <div class="pi">
              <div class="pnm"><span>${nm}</span>${br?`<span class="brnd">${br}</span>`:''}</div>
              <div class="pl">${or}${br?' · '+br:''}</div>
              <div class="pl">${sp}${wt?' · '+wt:''}${bw?' / '+bw:''}</div>
              ${pk?`<div class="pl">${pk}</div>`:''}
              ${(mp||sp2)?`<div class="pprice">
                ${mp?`<div class="pp-item"><span class="pp-lbl">整件</span><span class="pp-val">$${mp}</span></div>`:''}
                ${sp2?`<div class="pp-item"><span class="pp-lbl">散拿</span><span class="pp-val">$${sp2}</span></div>`:''}
              </div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function togCat(hdr){const cat=hdr.dataset.cat,cid=hdr.dataset.cid;catOpen[cat]=!catOpen[cat];hdr.classList.toggle('open',catOpen[cat]);document.getElementById(cid)?.classList.toggle('open',catOpen[cat]);}
document.getElementById('srch').addEventListener('input',e=>renderCat(e.target.value));

function tog(id){selIds.has(id)?(selIds.delete(id),delete iRem[id]):selIds.add(id);refresh();}
function removeItem(id){selIds.delete(id);delete iRem[id];refresh();}
function clearAll(){selIds.clear();iRem={};refresh();}
function refresh(){
  renderCat(document.getElementById('srch').value);
  if(aTab==='sel')renderSel();
  const n=selIds.size;
  document.getElementById('cnt').textContent=n;
  const b=document.getElementById('tbdg');b.textContent=n;b.style.display=n?'inline-block':'none';
}

function swTab(t){
  aTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.t===t));
  document.getElementById('p-cat').classList.toggle('active',t==='cat');
  document.getElementById('p-sel').classList.toggle('active',t==='sel');
  if(t==='sel')renderSel();
}

function renderSel(){
  const el=document.getElementById('selC');
  if(!selIds.size){el.innerHTML='<div class="empty"><div class="ei">📋</div>尚未選擇品項<br><small style="display:block;margin-top:6px">請切換到「產品目錄」勾選</small></div>';return;}
  el.innerHTML=[...selIds].map(id=>PRODS.find(p=>p.id===id)).filter(Boolean).map(p=>{
    const r=p.raw;
    const bw=r[C.BWt]&&r[C.BWt]!=='-'?r[C.BWt]:'';
    const pk=r[C.PKG]&&r[C.PKG]!=='-'?r[C.PKG]:'';
    const mkv=ci=>{const v=esc(String(r[ci]??''));return v?`<span class="pval">$${v}</span>`:`<span class="pval na">-</span>`;};
    return `<div class="icard">
      <div class="icard-top">
        <div class="ititle">
          <span class="inm">${esc(r[C.NM])}</span>
          ${r[C.BRD]?`<span class="ibrnd">${esc(r[C.BRD])}</span>`:''}
          <span class="iorig">${esc(r[C.ORIG])}</span>
        </div>
        <button class="irm" onclick="removeItem(${p.id})">✕</button>
      </div>
      <div class="imeta">
        <span class="mtag">${esc(r[C.SPEC])}</span>
        <span class="mtag">毛重 ${esc(r[C.WT])}</span>
        ${bw?`<span class="mtag">下盤 ${esc(bw)}</span>`:''}
        ${pk?`<span class="mtag">${esc(pk)}</span>`:''}
        ${r[C.PT]?`<span class="mtag">${esc(r[C.PT])}</span>`:''}
      </div>
      <div class="pgrid">
        <div class="pcell"><label>整件價</label>${mkv(C.MP)}</div>
        <div class="pcell"><label>散拿價</label>${mkv(C.SP)}</div>
      </div>
      <input class="rem-i" type="text" value="${esc(iRem[p.id]||'')}" oninput="iRem[${p.id}]=this.value" placeholder="品項備註（選填）">
    </div>`;
  }).join('');
}

/* ══ 產生 PDF：用 JSONP 繞過 CORS ══ */
function generatePDF(){
  if(!selIds.size){toast('請至少勾選一項品項',true);return;}
  const cust=document.getElementById('custN').value.trim();
  if(!cust){toast('請填寫客戶名稱',true);return;}
  const dt=document.getElementById('qDate').value;
  const rmk=document.getElementById('rmk').value.trim();
  const dateNum=dt.replace(/[^0-9]/g,'').substring(0,8);
  const quoteNo='FP-'+dateNum+'-'+String(Math.floor(Math.random()*900)+100);
  const items=[...selIds].map(id=>PRODS.find(p=>p.id===id)).filter(Boolean).map(p=>{
    const r=p.raw;
    return{cat:p.cat,orig:r[C.ORIG]||'',brand:r[C.BRD]||'',name:r[C.NM]||'',spec:r[C.SPEC]||'',
      weight:r[C.WT]||'',baseWeight:r[C.BWt]||'',pkg:r[C.PKG]||'',priceType:r[C.PT]||'',
      wholePrice:r[C.MP]||'',sellPrice:r[C.SP]||'',remark:iRem[p.id]||''};
  });
  const payload={quoteNo,customerName:cust,quoteDate:dt,
    salesAccount:currentUser.acc,salesName:currentUser.name,
    salesLine:currentUser.line,salesPhone:currentUser.phone,
    remark:rmk,items};
  const fname=dateNum+'_'+cust+'_'+quoteNo+'_挑食.pdf';

  document.getElementById('loadingOv').classList.add('show');
  document.getElementById('genBtn').disabled=true;

  /* JSONP：把資料 encode 進 URL 的 callback 參數 */
  const cbName='_gasCB_'+Date.now();
  const encoded=encodeURIComponent(JSON.stringify(payload));
  const url=CFG.GAS_URL+'?callback='+cbName+'&data='+encoded;

  let done=false;
  window[cbName]=function(res){
    done=true;
    cleanup();
    document.getElementById('loadingOv').classList.remove('show');
    document.getElementById('genBtn').disabled=false;
    if(!res||!res.success){toast('產生失敗：'+(res&&res.error||'未知錯誤'),true);return;}
    document.getElementById('mdlFname').textContent=res.fileName||fname;
    document.getElementById('dlBtn').href=res.downloadUrl||res.pdfUrl||'#';
    document.getElementById('resultOv').classList.add('open');
  };

  const script=document.createElement('script');
  script.src=url;
  script.onerror=function(){
    if(done)return;
    cleanup();
    document.getElementById('loadingOv').classList.remove('show');
    document.getElementById('genBtn').disabled=false;
    toast('連線失敗，請確認 GAS 已部署且網址正確',true);
  };

  function cleanup(){
    try{document.head.removeChild(script);}catch(e){}
    delete window[cbName];
  }

  /* 60 秒 timeout */
  setTimeout(function(){
    if(done)return;
    cleanup();
    document.getElementById('loadingOv').classList.remove('show');
    document.getElementById('genBtn').disabled=false;
    toast('逾時：GAS 處理過久，請再試一次',true);
  },60000);

  document.head.appendChild(script);
}

function closeResult(){document.getElementById('resultOv').classList.remove('open');}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',3500);}
</script>
